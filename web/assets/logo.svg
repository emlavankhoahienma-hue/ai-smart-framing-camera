<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="50%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E222D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <radialGradient id="lensGlass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2838"/>
      <stop offset="60%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Apple Squircle Base (22.37% Corner Radius on 512px = 114.53px) -->
  <rect x="4" y="4" width="504" height="504" rx="114.5" ry="114.5" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Golden Ratio Grid Lines (Subtle) -->
  <g stroke="#1E222D" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6">
    <line x1="195" y1="50" x2="195" y2="462" />
    <line x1="317" y1="50" x2="317" y2="462" />
    <line x1="50" y1="195" x2="462" y2="195" />
    <line x1="50" y1="317" x2="462" y2="317" />
  </g>

  <!-- AI Smart Framing Corner Brackets -->
  <g stroke="#3B82F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left Bracket -->
    <path d="M 120 160 L 120 120 L 160 120" />
    <!-- Top-Right Bracket -->
    <path d="M 352 120 L 392 120 L 392 160" />
    <!-- Bottom-Left Bracket -->
    <path d="M 120 352 L 120 392 L 160 392" />
    <!-- Bottom-Right Bracket -->
    <path d="M 352 392 L 392 392 L 392 352" />
  </g>

  <!-- Precision Horizon Level Bar (Subtle) -->
  <line x1="80" y1="256" x2="120" y2="256" stroke="#10B981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="392" y1="256" x2="432" y2="256" stroke="#10B981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="256" r="116" fill="url(#lensGlass)" stroke="#1E222D" stroke-width="3"/>
  <circle cx="256" cy="256" r="102" fill="none" stroke="#2D3242" stroke-width="1.5"/>

  <!-- Optical Aperture Blades / Iris -->
  <g stroke="#3B82F6" stroke-width="2.5" opacity="0.75" fill="none">
    <circle cx="256" cy="256" r="82" stroke-dasharray="8 6"/>
  </g>

  <!-- Center Core Sensor -->
  <circle cx="256" cy="256" r="54" fill="#0E121A" stroke="#3B82F6" stroke-width="3.5" filter="url(#softGlow)"/>
  
  <!-- Optical Reflection Arc -->
  <path d="M 230 220 A 38 38 0 0 1 282 220" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- Neural Engine Focal Point Dot -->
  <circle cx="256" cy="256" r="10" fill="#10B981"/>
  <circle cx="256" cy="256" r="4" fill="#F2F4F8"/>
</svg>
