name: Upload Artifact to Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag'
        required: true
        default: 'v1.0.0-build.267'
      run_id:
        description: 'Run ID'
        required: true
        default: '35847969641'

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Artifact from Run
        uses: actions/download-artifact@v4
        with:
          name: AISmartFramingCamera-IPA
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la
          gh release upload "${{ github.event.inputs.tag }}" AISmartFramingCamera.ipa --clobber
