name: iOS Sideload Build & Release

on:
  push:
    branches: [ main, 'arena/01a067b3-ai-smart-framing-camera' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export Google NIMA CoreML Model
        run: |
          pip install --upgrade pip
          pip install tf-keras "tensorflow<2.16" coremltools h5py pillow || pip install tf-keras tensorflow coremltools h5py pillow
          python scripts/export_nima_coreml.py
          xcrun coremlc compile NIMAAestheticScorer.mlpackage .
          ls -la NIMAAestheticScorer.mlmodelc || true

      - name: Build for iOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AISmartFramingCamera.xcodeproj \
            -scheme AISmartFramingCamera \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            BUILD_DIR=${{ github.workspace }}/build 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      # Push compiler errors ra branch riêng để developer đọc nhanh khi build fail
      - name: Publish build errors to report branch
        if: failure()
        run: |
          {
            echo "# Build errors - run ${{ github.run_id }} - ${{ github.sha }}"
            echo
            if [ -f build.log ]; then
              echo "=== Swift/clang error lines ==="
              grep -nE " error: |fatal error: " build.log | head -80 || true
              echo
              echo "=== Last 60 lines of xcodebuild output ==="
              tail -60 build.log || true
            else
              echo "No build.log found."
            fi
          } > BUILD_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-build-report || git checkout -B ci-build-report
          git rm -rfq . || true
          git add BUILD_ERROR.txt
          git commit -qm "ci: build report" || true
          git push -fq origin HEAD:refs/heads/arena/build-report || true
          echo "✓ Đã push BUILD_ERROR.txt lên branch arena/build-report"

      - name: Create Payload directory
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/AISmartFramingCamera.app Payload/
          if [ -d "NIMAAestheticScorer.mlmodelc" ]; then
            cp -r NIMAAestheticScorer.mlmodelc Payload/AISmartFramingCamera.app/
            echo "✅ Included NIMAAestheticScorer.mlmodelc into App Bundle!"
          else
            echo "⚠️ NIMAAestheticScorer.mlmodelc not found, proceeding with heuristic fallback."
          fi

      - name: Package IPA
        run: |
          zip -r AISmartFramingCamera.ipa Payload/
          echo "IPA size: $(du -h AISmartFramingCamera.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISmartFramingCamera-IPA
          path: AISmartFramingCamera.ipa

      - name: Package Source Code
        if: github.ref == 'refs/heads/main'
        run: |
          git archive --format=zip HEAD -o AISmartFramingCamera-SourceCode.zip
          echo "Source code zip size: $(du -h AISmartFramingCamera-SourceCode.zip | cut -f1)"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          gh release create "$TAG" \
            AISmartFramingCamera.ipa \
            AISmartFramingCamera-SourceCode.zip \
            --title "AI Smart Framing Camera $TAG" \
            --notes "Unsigned IPA build for Sideloadly / AltStore / TrollStore installation.

          ## Features
          - ✨ Google NIMA (Neural Image Assessment) Deep Aesthetic Scoring (ANE)
          - 🖼️ 5-Angle Candidate Framing Optimization
          - 🎯 Real-time AI Subject & Face Tracking (Neural Engine accelerated)
          - 📐 Rule of Thirds & Golden Ratio Framing Guides
          - ⚡ Magnetic Snap Haptics & Auto-Alignment Crosshair
          - 🎨 CoreImage Film Simulation Recipes (Fuji Pro 400H, Kodak Portra, Cine Teal/Orange)
          - 🔍 Dynamic Auto-Zoom Adjustment

          ## Installation via Sideloadly
          1. Download \`AISmartFramingCamera.ipa\` from this release
          2. Connect iPhone via USB and open Sideloadly
          3. Drag the IPA into Sideloadly, enter Apple ID, and click Start
          4. On iPhone: Settings > General > VPN & Device Management > Trust Developer Profile

          ## System Requirements
          - iPhone with A11 Bionic to A18 Pro (iPhone 8 / X or later)
          - iOS 16.0 or later"
