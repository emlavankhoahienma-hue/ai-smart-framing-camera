name: iOS Sideload Build & Release

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'web/**'
      - 'README.md'
      - 'docs/**'
  push:
    branches: [ main, 'arena/01a067b3-ai-smart-framing-camera' ]
    paths-ignore:
      - 'web/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          latest=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting latest Xcode: $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            echo "Falling back to default Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run native composition regressions
        run: |
          xcrun swiftc -O -warnings-as-errors \
            AISmartFramingCamera/Services/TrackingGeometry.swift \
            AISmartFramingCamera/Services/CompositionPlanning.swift \
            AISmartFramingCamera/Services/CompositionImageEvidence.swift \
            AISmartFramingCamera/Services/PhotographicCompositionModel.swift \
            AISmartFramingCamera/Services/CharmPhotographicModel.swift \
            AISmartFramingCamera/Services/PortraitFramingEvidence.swift \
            AISmartFramingCamera/Services/FocalCropModel.swift \
            AISmartFramingCamera/Services/CompositionAestheticSearch.swift \
            tests/CompositionPlanningRegression.swift \
            -o "$RUNNER_TEMP/composition-regressions"
          "$RUNNER_TEMP/composition-regressions"

      - name: Run native viewfinder presentation regressions
        run: |
          xcrun swiftc -O -warnings-as-errors \
            AISmartFramingCamera/Services/TrackingGeometry.swift \
            AISmartFramingCamera/Services/ViewfinderPresentation.swift \
            tests/ViewfinderPresentationRegression.swift \
            -o "$RUNNER_TEMP/viewfinder-regressions"
          "$RUNNER_TEMP/viewfinder-regressions"

      - name: Run viewport and real video export regressions
        run: |
          xcrun swiftc -O -warnings-as-errors \
            AISmartFramingCamera/Services/CaptureViewportGeometry.swift \
            tests/CaptureViewportRegression.swift -o "$RUNNER_TEMP/viewport-tests"
          "$RUNNER_TEMP/viewport-tests"
          xcrun swiftc -O -warnings-as-errors \
            AISmartFramingCamera/Services/CaptureViewportGeometry.swift \
            AISmartFramingCamera/Services/VideoFrameRenderer.swift \
            tests/VideoFrameRegression.swift -o "$RUNNER_TEMP/video-tests"
          "$RUNNER_TEMP/video-tests" validation/video-export

      - name: Verify target tracking boundary
        run: python scripts/verify_tracking_boundary.py

      - name: Compile iOS source before model export
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project AISmartFramingCamera.xcodeproj \
            -scheme AISmartFramingCamera \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            BUILD_DIR=${{ github.workspace }}/build 2>&1 | tee build.log

      - name: Run native capture transition regressions
        run: |
          xcrun swiftc -O -warnings-as-errors \
            AISmartFramingCamera/Services/TrackingGeometry.swift \
            AISmartFramingCamera/Services/CaptureReadinessPolicy.swift \
            tests/CaptureTransitionRegression.swift \
            -o "$RUNNER_TEMP/capture-transition-regressions"
          "$RUNNER_TEMP/capture-transition-regressions"

      - name: Compile native real-photo validation before model export
        run: python scripts/validate_composition_photos.py --compile-only

      - name: Export & Compile pretrained YOLO12s and YOLO12n
        env:
          # Ultralytics/CoreMLTools currently emit upstream torch tracing and
          # output-renaming notices that do not identify defects in this app.
          PYTHONWARNINGS: ignore
        run: |
          pip install --upgrade pip
          pip install "torch==2.5.1" "numpy==1.26.4" \
            "ultralytics==8.4.178" "coremltools==9.0"
          curl --fail --location --retry 3 \
            https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo12n.pt \
            --output yolo12n.pt
          curl --fail --location --retry 3 \
            https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo12s.pt \
            --output yolo12s.pt
          echo "419ff3dca37d69bacc93a50fa0c186a1c6f9fe62fae0f108b0872829689e9ca6  yolo12n.pt" | shasum -a 256 --check
          echo "e915c2c4286e3f6f8610ef106fa3f94a7b8c19b30eccede5887e22c33ef75f58  yolo12s.pt" | shasum -a 256 --check
          python -c "from ultralytics import YOLO; YOLO('yolo12n.pt').export(format='coreml', nms=True, half=True); YOLO('yolo12s.pt').export(format='coreml', nms=True, half=True)"
          xcrun coremlc compile yolo12n.mlpackage .
          xcrun coremlc compile yolo12s.mlpackage .
          test -d yolo12n.mlmodelc
          test -d yolo12s.mlmodelc

      - name: Export, verify and compile pinned SigLIP
        run: |
          pip install "torch==2.5.1" "transformers==4.46.3" \
            "huggingface_hub==0.26.2" "safetensors==0.4.5" \
            "numpy==1.26.4" "Pillow==11.0.0" "sentencepiece==0.2.0"
          python scripts/export_siglip_coreml.py
          xcrun coremlc compile SigLIPBaseImage.mlpackage .
          test -d SigLIPBaseImage.mlmodelc
          test -s SigLIPPrompts.json
          test -s SigLIPModelManifest.json

      - name: Cache photographic model and evaluation data
        uses: actions/cache@v5
        with:
          path: .model-cache
          key: composition-cadb-samp-charm-focal-v3
          restore-keys: composition-cadb-samp-v1

      - name: Export and verify pretrained SAMP-Net composition specialist
        run: |
          pip install "torch==2.5.1" "torchvision==0.20.1" "numpy==1.26.4" \
            "coremltools==9.0" "opencv-python-headless==4.11.0.86" \
            "einops==0.8.1" "Pillow==11.0.0"
          python scripts/prepare_composition_photos.py
          python scripts/export_composition_coreml.py --photos validation/photos
          xcrun coremlc compile SAMPComposition.mlpackage .
          pip install "transformers==4.36.0" "tokenizers==0.15.2" "ml-collections==0.1.1"
          python scripts/export_charm_coreml.py --photos validation/photos
          xcrun coremlc compile CharmAesthetics.mlpackage .
          pip install "timm==1.0.27"
          python scripts/export_focal_coreml.py
          xcrun coremlc compile FocalCrop.mlpackage .
          python scripts/validate_focal_model.py
          test -d SAMPComposition.mlmodelc

      - name: Validate Swift photographic model and crop safety on real images
        run: |
          python scripts/prepare_pose_photos.py
          python scripts/validate_composition_photos.py

      - name: Check repeated model lifetime with real photos
        run: |
          xcrun swiftc -O -warnings-as-errors \
            AISmartFramingCamera/Services/TrackingGeometry.swift \
            AISmartFramingCamera/Services/CompositionPlanning.swift \
            AISmartFramingCamera/Services/CompositionImageEvidence.swift \
            AISmartFramingCamera/Services/PhotographicCompositionModel.swift \
            AISmartFramingCamera/Services/CharmPhotographicModel.swift \
            AISmartFramingCamera/Services/FocalCropModel.swift \
            tests/InferenceLifetimeRegression.swift -o "$RUNNER_TEMP/lifetime-tests"
          "$RUNNER_TEMP/lifetime-tests" "$GITHUB_WORKSPACE"

      - name: Validate preserved YOLO recognition on real photographs
        run: python scripts/validate_detector_photos.py

      - name: Validate measured portrait framing on all human test photos
        run: |
          xcrun swiftc -O -warnings-as-errors \
            AISmartFramingCamera/Services/PortraitFramingEvidence.swift \
            tests/PortraitPoseDiagnostic.swift -o "$RUNNER_TEMP/portrait-pose-diagnostic"
          "$RUNNER_TEMP/portrait-pose-diagnostic" validation/pose/photos validation/pose-report.json

      - name: Upload photographic model validation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Photographic-Composition-Validation
          path: |
            SAMPModelManifest.json
            CharmModelManifest.json
            FocalModelManifest.json
            validation/swift/
            validation/video-export/
            validation/focal/
            validation/detection/*-real-photos.json
            validation/photos/manifest.json
            validation/pose-report.json

      - name: Build for iOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AISmartFramingCamera.xcodeproj \
            -scheme AISmartFramingCamera \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            BUILD_DIR=${{ github.workspace }}/build 2>&1 | tee build.log

          diagnostic_pattern="$(printf '%s%s' 'warn' 'ing:')"
          if grep -nF "$diagnostic_pattern" build.log; then
            echo "Build diagnostics must be clean; release artifacts will not be published."
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      # Push compiler errors ra branch riêng để developer đọc nhanh khi build fail
      - name: Publish build errors to report branch
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          touch build.log
          {
            echo "# Build errors - run ${{ github.run_id }} - ${{ github.sha }}"
            echo
            echo "=== Swift/clang error lines ==="
            grep -nE " error: |fatal error: " build.log | head -80
            echo
            echo "=== Last 60 lines of xcodebuild output ==="
            tail -60 build.log
          } > BUILD_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-build-report
          git rm -rfq . || true
          git add BUILD_ERROR.txt
          git commit -qm "ci: build report"
          git push -fq origin HEAD:refs/heads/arena/build-report
          echo " Đã push BUILD_ERROR.txt lên branch arena/build-report"

      - name: Create Payload directory
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/AISmartFramingCamera.app Payload/
          test -d yolo12n.mlmodelc
          test -d yolo12s.mlmodelc
          cp -r yolo12n.mlmodelc Payload/AISmartFramingCamera.app/
          cp -r yolo12s.mlmodelc Payload/AISmartFramingCamera.app/
          if [ -f "AISmartFramingCamera/Services/RobustTargetEmbedder.bin" ]; then
            cp AISmartFramingCamera/Services/RobustTargetEmbedder.bin Payload/AISmartFramingCamera.app/
            echo " Đã tích hợp thành công RobustTargetEmbedder.bin vào App Bundle!"
          fi
          test -d Payload/AISmartFramingCamera.app/yolo12n.mlmodelc
          test -d Payload/AISmartFramingCamera.app/yolo12s.mlmodelc
          test -d SigLIPBaseImage.mlmodelc
          cp -r SigLIPBaseImage.mlmodelc Payload/AISmartFramingCamera.app/
          cp SigLIPPrompts.json SigLIPModelManifest.json Payload/AISmartFramingCamera.app/
          test -d SAMPComposition.mlmodelc
          cp -r SAMPComposition.mlmodelc Payload/AISmartFramingCamera.app/
          cp SAMPModelManifest.json Payload/AISmartFramingCamera.app/
          cp models/SAMP-Net-LICENSE.txt Payload/AISmartFramingCamera.app/
          cp -r FocalCrop.mlmodelc Payload/AISmartFramingCamera.app/
          cp FocalModelManifest.json models/FocalNet-LICENSE.txt Payload/AISmartFramingCamera.app/
          cp -r CharmAesthetics.mlmodelc Payload/AISmartFramingCamera.app/
          cp CharmModelManifest.json CharmPositionEmbedding.bin models/Charm-LICENSE.txt Payload/AISmartFramingCamera.app/
          if [ -s AISmartFramingCamera/Resources/LocalAutoselectThresholds.json ]; then
            cp AISmartFramingCamera/Resources/LocalAutoselectThresholds.json Payload/AISmartFramingCamera.app/
          fi
          test -d Payload/AISmartFramingCamera.app/SigLIPBaseImage.mlmodelc
          test -s Payload/AISmartFramingCamera.app/SigLIPPrompts.json
          python scripts/verify_model_bundle.py Payload/AISmartFramingCamera.app

      - name: Package IPA
        run: |
          zip -qry -9 AISmartFramingCamera.ipa Payload/
          echo "IPA size: $(du -h AISmartFramingCamera.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: AISmartFramingCamera-IPA
          path: AISmartFramingCamera.ipa

      - name: Package Source Code
        if: github.ref == 'refs/heads/main'
        run: |
          git archive --format=zip HEAD -o AISmartFramingCamera-SourceCode.zip
          echo "Source code zip size: $(du -h AISmartFramingCamera-SourceCode.zip | cut -f1)"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          FAST_URL="https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/$TAG/AISmartFramingCamera.ipa"
          gh release create "$TAG" \
            AISmartFramingCamera.ipa \
            AISmartFramingCamera-SourceCode.zip \
            --title "AI Smart Framing Camera $TAG" \
            --notes "Unsigned IPA build for Sideloadly / AltStore / TrollStore installation.

          ###  Link tải tốc độ cao (Tối ưu cho Việt Nam / Chống bóp băng thông):
          - **[Tải trực tiếp tốc độ cao qua Cloudflare HK CDN]($FAST_URL)** (Khuyến nghị cho mạng VNPT/Viettel/FPT, hỗ trợ tải tiếp khi rớt mạng).

          ## Features
          -  Real-time AI Subject & Face Tracking (Neural Engine accelerated)
          -  Rule of Thirds & Golden Ratio Framing Guides
          -  Magnetic Snap Haptics & Auto-Alignment Crosshair
          -  CoreImage Film Simulation Recipes (Fuji Pro 400H, Kodak Portra, Cine Teal/Orange)
          -  Dynamic Auto-Zoom Adjustment

          ## Installation via Sideloadly
          1. Download \`AISmartFramingCamera.ipa\` from this release
          2. Connect iPhone via USB and open Sideloadly
          3. Drag the IPA into Sideloadly, enter Apple ID, and click Start
          4. On iPhone: Settings > General > VPN & Device Management > Trust Developer Profile

          ## System Requirements
          - iPhone compatible with iOS 17 or later
          - iOS 17.0 or later"
