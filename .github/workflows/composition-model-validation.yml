name: Photographic composition model validation
on:
  workflow_dispatch:
jobs:
  pose-diagnostic:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          path: .model-cache
          key: composition-cadb-samp-charm-v2
          restore-keys: composition-cadb-samp-v1
      - name: Prepare all human test photos
        run: |
          pip install Pillow==11.0.0
          python scripts/prepare_pose_photos.py
      - name: Diagnose actual Vision pose evidence
        run: |
          xcrun swiftc -O -warnings-as-errors AISmartFramingCamera/Services/PortraitFramingEvidence.swift tests/PortraitPoseDiagnostic.swift -o "$RUNNER_TEMP/pose-diagnostic"
          "$RUNNER_TEMP/pose-diagnostic" validation/pose/photos validation/pose-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Portrait-Pose-Diagnostic
          path: validation/pose-report.json
