name: UI Simulator Snapshots

on:
  workflow_dispatch:

jobs:
  snapshot:
    name: Render iOS Simulator UI Snapshots
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build for iOS Simulator (arm64)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AISmartFramingCamera.xcodeproj \
            -scheme AISmartFramingCamera \
            -sdk iphonesimulator \
            -arch arm64 \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            BUILD_DIR=${{ github.workspace }}/simbuild 2>&1 | tee simbuild.log

      - name: Boot iPhone Simulator & Capture Real UI Screenshots
        run: |
          set -euo pipefail
          mkdir -p ui_snapshots

          # Pick latest available iPhone Pro / standard iPhone simulator
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          candidates = []
          for runtime, devs in data.items():
              if 'iOS' not in runtime: continue
              for d in devs:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      score = 0
                      name = d['name']
                      if '16 Pro' in name and 'Max' not in name: score = 100
                      elif '16' in name and 'Max' not in name and 'Plus' not in name: score = 90
                      elif '15 Pro' in name and 'Max' not in name: score = 80
                      elif '15' in name: score = 70
                      else: score = 50
                      candidates.append((score, runtime, d['udid'], name))
          candidates.sort(reverse=True)
          print(candidates[0][2])
          ")
          echo "Using Simulator UDID: $SIM_UDID"

          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          # Set clean studio status bar (9:41, 5G, full battery)
          xcrun simctl status_bar "$SIM_UDID" override \
            --time "9:41" \
            --dataNetwork 5g \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100 || true

          # Install built simulator app
          APP_PATH="${{ github.workspace }}/simbuild/Release-iphonesimulator/AISmartFramingCamera.app"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          # Stage a rich photorealistic interior/architectural scene inside the app's Documents dir
          # so real SwiftUI .ultraThinMaterial glass blur is tested authentically!
          DATA_DIR=$(xcrun simctl get_app_container "$SIM_UDID" com.aismartframing.camera data)
          mkdir -p "$DATA_DIR/Documents"
          BG_PATH="$DATA_DIR/Documents/snapshot_bg.jpg"

          python3 - "$BG_PATH" <<'PY'
          import math, struct, zlib, sys
          # Try to find a real JPEG/PNG photo in repo first, else synthesize a crisp warm daylight studio interior scene
          from pathlib import Path
          import shutil
          out_path = Path(sys.argv[1])
          repo_photos = sorted(
              list(Path(".").glob("validation/**/*.jpg")) +
              list(Path(".").glob("validation/**/*.jpeg")) +
              list(Path(".").glob("docs/**/*.jpg"))
          )
          if repo_photos:
              shutil.copyfile(repo_photos[0], out_path)
              print(f"Copied repo sample photo: {repo_photos[0]}")
          else:
              # Generate a soft photographic daylight architectural interior + walnut table + warm bokeh backdrop
              W, H = 720, 960
              raw = bytearray()
              for y in range(H):
                  raw.append(0)
                  ny = y / H
                  for x in range(W):
                      nx = x / W
                      # Natural lens vignette
                      vx = (nx - 0.5) * 1.4
                      vy = (ny - 0.48) * 1.3
                      vig = max(0.68, 1.0 - 0.24 * (vx * vx + vy * vy))
                      if ny < 0.66:
                          # Soft sunlit warm travertine studio wall with natural diagonal window light falloff
                          beam = math.exp(-((nx - 0.62 - (ny - 0.18) * 0.42) ** 2) / 0.10)
                          r = (176 + 52 * beam - 42 * ny)
                          g = (170 + 46 * beam - 44 * ny)
                          b = (158 + 36 * beam - 46 * ny)
                          # Soft out-of-focus architectural window frame shadow on left
                          fx = max(0.0, min(1.0, (0.38 - nx) * 8.0)) * max(0.0, min(1.0, (nx - 0.05) * 8.0))
                          fy = max(0.0, min(1.0, (0.56 - ny) * 8.0)) * max(0.0, min(1.0, (ny - 0.12) * 8.0))
                          win = fx * fy
                          r = r * (1.0 - 0.65 * win) + 34 * win
                          g = g * (1.0 - 0.65 * win) + 36 * win
                          b = b * (1.0 - 0.65 * win) + 40 * win
                          # Soft out-of-focus warm sunset/lamp bokeh orb on upper right
                          orb1 = math.exp(-(((nx - 0.74) ** 2) / 0.018 + ((ny - 0.36) ** 2) / 0.028))
                          r += 38 * orb1
                          g += 24 * orb1
                          b += 8 * orb1
                          # Subtle soft sage-olive botanical bokeh silhouette
                          orb2 = math.exp(-(((nx - 0.80) ** 2) / 0.015 + ((ny - 0.54) ** 2) / 0.030))
                          r = r * (1.0 - 0.45 * orb2) + 52 * orb2
                          g = g * (1.0 - 0.45 * orb2) + 74 * orb2
                          b = b * (1.0 - 0.45 * orb2) + 54 * orb2
                      else:
                          # Rich brushed walnut table surface with subtle perspective depth
                          depth = (ny - 0.66) / 0.34
                          grain = math.sin(y * 0.42 + math.sin(x * 0.025) * 4.0) * 5.0
                          spec = math.exp(-((nx - 0.56) ** 2) / 0.14) * (1.0 - depth * 0.65) * 28.0
                          r = 88 - 34 * depth + grain + spec
                          g = 64 - 25 * depth + grain * 0.7 + spec * 0.85
                          b = 48 - 18 * depth + grain * 0.5 + spec * 0.65
                      r = int(max(12, min(255, r * vig)))
                      g = int(max(12, min(255, g * vig)))
                      b = int(max(12, min(255, b * vig)))
                      raw.extend((r, g, b))
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", W, H, 8, 2, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 6)) + chunk(b"IEND", b"")
              out_path.write_bytes(png)
              print(f"Synthesized studio backdrop at {out_path}")
          PY

          # Pre-warm app binary/dyld cache on freshly booted simulator so 01_main_photo never catches the launch screen
          xcrun simctl launch "$SIM_UDID" com.aismartframing.camera \
            -UI_SNAPSHOT_MODE \
            -UI_SNAPSHOT_SCREEN "main_photo" \
            -UI_SNAPSHOT_BG "$BG_PATH" || true
          sleep 5.0
          xcrun simctl terminate "$SIM_UDID" com.aismartframing.camera || true
          sleep 0.6

          SCREENS=(
            "01_main_photo:main_photo"
            "02_main_drawer:main_drawer"
            "03_main_film:main_film"
            "04_main_windowed:main_windowed"
            "05_main_video:main_video"
            "06_settings_capture:settings_capture"
            "07_settings_ai:settings_ai"
            "08_settings_advanced:settings_advanced"
            "09_main_drawer_video:main_drawer_video"
            "10_main_histogram_pro:main_histogram_pro"
          )

          for entry in "${SCREENS[@]}"; do
            FILE_TAG="${entry%%:*}"
            SCREEN_ARG="${entry##*:}"
            echo "=== Capturing $FILE_TAG ($SCREEN_ARG) ==="
            xcrun simctl terminate "$SIM_UDID" com.aismartframing.camera || true
            sleep 0.5
            xcrun simctl launch "$SIM_UDID" com.aismartframing.camera \
              -UI_SNAPSHOT_MODE \
              -UI_SNAPSHOT_SCREEN "$SCREEN_ARG" \
              -UI_SNAPSHOT_BG "$BG_PATH"
            sleep 3.2
            xcrun simctl io "$SIM_UDID" screenshot "ui_snapshots/${FILE_TAG}.png"
          done
          ls -lh ui_snapshots/

      - name: Upload UI Snapshots Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ui-snapshots-${{ github.run_id }}
          path: ui_snapshots/*.png
          retention-days: 7
